name: DCO

# Separate from release-matrix.yml on purpose. That workflow runs on tags
# only, because a contributor can run its suite locally before opening a PR.
# This check is the
# opposite case: it gates the one thing review cannot reliably eyeball and the
# contributor cannot re-run for us — every commit carrying the sign-off that
# CONTRIBUTING.md turns into agreement with the CLA. Without the CLA the
# AGPL-3.0 + commercial dual licence cannot cover someone else's commit. It
# costs seconds of a runner, so a pull_request trigger earns its keep here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off:
    # The maintainer holds the copyright, so no CLA to agree to / sign-off owed.
    if: ${{ github.event.pull_request.user.login != 'mpnvdlee' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # base..head below needs both endpoints and everything between them.
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by trailer for its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Merge commits are excluded: GitHub authors the ones that appear when
          # a contributor syncs their branch, and nobody can sign those off.
          while read -r sha; do
            author_email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
              | grep -qiF "<$author_email>"; then
              continue
            fi
            echo "::error::$sha (\"$subject\") has no \"Signed-off-by: ... <$author_email>\" trailer."
            missing=1
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "::error::Sign off every commit with 'git commit -s' (see .github/CONTRIBUTING.md). Existing commits: git rebase --signoff $BASE_SHA, then force-push."
            exit 1
          fi
          echo "Every commit in this pull request is signed off."
