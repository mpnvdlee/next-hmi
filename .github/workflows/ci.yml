name: CI

# Release and release-candidate tags only. Neither a pull_request nor a
# push-to-main trigger earns its runner here: contributors run the identical
# checks locally before opening a PR (CONTRIBUTING.md), and every merge into
# main would otherwise spend a runner on a suite nobody is waiting on. A tag —
# rc or final — is the one point where the result gates something.
#
# One carve-out, in bundle-budget.yml: size budgets fail on aggregate creep
# rather than on any single change, so running them locally before a PR catches
# nothing. That check alone runs per-PR.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend
      - name: Test
        run: pytest --cov=backend --cov-report=term-missing backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # One unambiguous needle for "did enterprise code reach the bundle?".
      # It exists only inside the stand-in registry written below, so the scan
      # does not depend on a hand-maintained list of today's enterprise UI
      # strings — a list that silently stops covering the next module.
      ENTERPRISE_MARKER: enterprise-only-string-that-must-never-ship-9f13c7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm run build` compiles the built-in (stdlib) widgets first, and that
      # step shells out to the backend's widget compiler — a Python module that
      # imports tree_sitter. Without an interpreter and those deps the build
      # fails before Vite ever runs. esbuild, the compiler's other prerequisite,
      # comes from frontend/node_modules/.bin via `npm ci` below.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: npm ci
      - name: Install the widget compiler's Python dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test:coverage
      # This job checks out only the public repository; the enterprise half is
      # a separate private repo, gitignored here. With nothing at
      # enterprise/frontend/registry.ts the purity check below would be
      # vacuous — the `@enterprise` alias would have no ee target to resolve
      # to and dist/ would be clean by construction rather than by rule. So
      # stand in for the private repo before building. A real module differs
      # only in what it contributes; the seam it arrives through is identical.
      #
      # The stand-in is the committed oss stub plus one marker side effect, so
      # it mirrors the stub's export surface for free — growing the seam by an
      # export cannot break this job, only a change to the seam itself can.
      - name: Stand in for the private enterprise repository
        run: |
          set -euo pipefail
          if [ -e ../enterprise ]; then
            echo "::error::enterprise/ already exists in this workspace — refusing to overwrite a real checkout."
            exit 1
          fi
          mkdir -p ../enterprise/frontend
          {
            cat src/enterprise/registry.ts
            printf '\nObject.assign(globalThis, { __nexthmiEnterpriseMarker: %s })\n' "'$ENTERPRISE_MARKER'"
          } > ../enterprise/frontend/registry.ts
      - name: Build (also type-checks)
        run: npm run build
      # The load-bearing rule of the two-edition split: an AGPL build published
      # to everyone must carry no proprietary code.
      #
      # What this proves: the default build (NEXTHMI_EDITION unset -> oss)
      # ignores an enterprise registry sitting right beside it — the exact
      # shape Bitwarden's default artifact fails — and the scan that reports so
      # can actually see enterprise code. The ee build is the positive control:
      # a broken alias, an emptied registry, or a scan that quietly stopped
      # matching fails the job instead of passing it.
      #
      # What it does not prove: anything about the Python side or the packaged
      # binary. No job in this workflow builds or inspects a PyInstaller
      # artifact. The backend half is covered elsewhere and only elsewhere —
      # backend/tests/test_edition_separation.py at source level (no core
      # module imports enterprise code; only launcher.py names an ee
      # entrypoint), and build/nexthmi.spec at packaging time (it refuses to
      # put an enterprise SPA or the enterprise tree into an oss binary).
      - name: Assert the public bundle carries no enterprise code
        run: |
          set -euo pipefail
          NEXTHMI_EDITION=ee npx vite build --outDir dist-ee
          if ! grep -rqF "$ENTERPRISE_MARKER" dist-ee; then
            echo "::error::Positive control failed — the ee bundle does not carry the marker, so this check could not have detected a leak."
            exit 1
          fi
          if grep -rlF "$ENTERPRISE_MARKER" dist; then
            echo "::error::Enterprise code reached the open-source bundle."
            exit 1
          fi
          rm -rf dist-ee ../enterprise
          echo "Public bundle is clean, and the scan is proven able to see enterprise code."
