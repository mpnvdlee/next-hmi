services:
  nexthmi:
    image: nexthmi:latest
    build: .
    container_name: nexthmi
    ports:
      # With HTTPS enabled in Settings the app moves to 8443 and 8000 only
      # redirects there, so both have to be published for the toggle to work.
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./project-data:/data
    restart: unless-stopped
