target-version = "py314"

[lint]
# E4/E7/E9/F is the stable correctness baseline; I (isort), UP
# (pyupgrade), B (bugbear), SIM (flake8-simplify), and RUF (Ruff-specific)
# sit on top of it.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

# FastAPI's dependency-injection markers (Depends/File/Body/...) are meant to
# be called in argument defaults -- that's how FastAPI recognizes them. B008
# otherwise flags them as the general "mutable default" anti-pattern.
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Body"]

